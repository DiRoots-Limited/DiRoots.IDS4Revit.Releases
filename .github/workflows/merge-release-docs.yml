name: Documentation after stable release
on:
  release:
    types: [released]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-docs-${{ github.repository }}
  cancel-in-progress: false
jobs:
  merge-documentation:
    if: vars.RELEASE_DOCS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify live configuration
        if: vars.RELEASE_DOCS_LIVE == 'true'
        env:
          MERGE_TOKEN: ${{ secrets.MERGE_PR_AFTER_RELEASE }}
          MERGE_ACTOR: ${{ vars.RELEASE_DOCS_MERGE_ACTOR }}
        run: |
          if [ -z "$MERGE_TOKEN" ] || [ -z "$MERGE_ACTOR" ]; then
            echo '::error::Live mode requires MERGE_PR_AFTER_RELEASE and RELEASE_DOCS_MERGE_ACTOR.'
            exit 1
          fi
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LIVE: ${{ vars.RELEASE_DOCS_LIVE }}
          MERGE_ACTOR: ${{ vars.RELEASE_DOCS_MERGE_ACTOR }}
          DOCS_BRANCH: ${{ vars.RELEASE_DOCS_BRANCH || 'gh-pages' }}
        with:
          github-token: ${{ vars.RELEASE_DOCS_LIVE == 'true' && secrets.MERGE_PR_AFTER_RELEASE || github.token }}
          retries: 0
          script: |
            const handleRelease = require('./.github/scripts/merge-release-docs.cjs');
            try {
              const { results, failed } = await handleRelease({ github, core, repository: context.repo,
                eventName: context.eventName, event: context.payload,
                expectedActor: process.env.MERGE_ACTOR,
                docsBranch: process.env.DOCS_BRANCH,
                dryRun: process.env.LIVE !== 'true' });
              await core.summary.addHeading('Release documentation: one event')
                .addList(results).write();
              if (failed) core.setFailed('Some targeted PRs were not merged. See summary; no automatic retry.');
            } catch (error) {
              await core.summary.addHeading('Release documentation: stopped')
                .addRaw('An API or configuration error prevented completion. See the run error. No automatic retry.').write();
              core.setFailed(error.message);
            }
