name: IDS documentation after stable release

on:
  release:
    types: [released]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ids-release-documentation-test
  cancel-in-progress: false

jobs:
  merge-documentation:
    if: vars.IDS_DOCS_PILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: test_docs_trigger
          persist-credentials: false

      - name: Installation token for live merges
        if: vars.IDS_DOCS_PILOT_LIVE == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.IDS_DOCS_APP_ID }}
          private-key: ${{ secrets.IDS_DOCS_APP_PRIVATE_KEY }}
          owner: DiRoots-Limited
          repositories: DiRoots.IDS4Revit.Releases

      - uses: actions/github-script@v7
        env:
          PILOT_LIVE: ${{ vars.IDS_DOCS_PILOT_LIVE }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const handleRelease = require('./.github/scripts/merge-release-docs.cjs');
            const config = require('./.github/docs-releases.json');
            const results = await handleRelease({
              github,
              core,
              config,
              eventName: context.eventName,
              event: context.payload,
              dryRun: process.env.PILOT_LIVE !== 'true'
            });
            await core.summary
              .addHeading('Documentation: one release event')
              .addList(results)
              .write();
